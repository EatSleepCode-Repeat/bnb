[package]
name = "bnb-shell"
version = "0.1.3"
edition = "2021"
authors = ["Chris Clines"]
description = "A fast, polished, cross-platform terminal shell built in Rust with Powerlevel10k aesthetics."
license = "MIT"
repository = "https://github.com/EatSleepCode-Repeat/bnb"
readme = "README.md"
keywords = ["shell", "terminal", "zsh", "prompt", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "bnb"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
rustyline = "14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4"
