[package]
name = "bnb-shell"
version = "0.5.4"
edition = "2021"
authors = ["Chris Clines"]
description = "A fast, polished terminal shell built in Rust with built-in Secret Guard, local vault, and Powerlevel10k aesthetics."
license = "MIT"
repository = "https://github.com/EatSleepCode-Repeat/bnb"
readme = "README.md"
homepage = "https://github.com/EatSleepCode-Repeat/bnb"

keywords = ["shell", "terminal", "zsh", "secrets", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bnb"
path = "src/main.rs"

[dependencies]
rustyline = "14.0"
terminal_size = "0.4"
crossterm = "0.29"
fuzzy-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "6.0"
toml = "0.8"
regex = "1.10"